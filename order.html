<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Оформление заявки — учебный интернет-магазин</title>
  <meta name="description" content="Форма заявки: укажите имя, e-mail, телефон и тему обращения, и мы свяжемся с вами.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="js/main.js" defer></script>
</head>
<body id="top">
  <a class="skip-link" href="#content">К содержимому</a>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-header__logo" href="index.html">ShopProject</a>
      <nav class="site-nav" aria-label="Основная навигация">
        <ul class="site-nav__list">
          <li class="site-nav__item"><a class="site-nav__link" href="index.html">Главная</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="catalog.html">Каталог</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="product.html">Товар</a></li>
          <li class="site-nav__item"><a class="site-nav__link site-nav__link--active" aria-current="page" href="order.html">Заявка</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="contacts.html">Контакты</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <main class="page" id="content" tabindex="-1">
    <nav class="breadcrumbs" aria-label="Хлебные крошки">
      <a href="index.html">Главная</a>
      <span>Заявка</span>
    </nav>

    <h1>Оформление заявки</h1>
    <form class="order-form" id="order-form">
      <div class="order-form__field">
        <label class="order-form__label" for="name">Имя</label>
        <input class="order-form__input" id="name" name="name" type="text" placeholder="Введите ваше имя" autocomplete="given-name" required>
      </div>
      <div class="order-form__field">
        <label class="order-form__label" for="email">E-mail</label>
        <input class="order-form__input" id="email" name="email" type="email" placeholder="example@mail.ru" autocomplete="email" required>
      </div>
      <div class="order-form__field">
        <label class="order-form__label" for="phone">Телефон</label>
        <input class="order-form__input" id="phone" name="phone" type="tel" placeholder="+7 (900) 000-00-00" autocomplete="tel" required>
      </div>
      <div class="order-form__field">
        <label class="order-form__label" for="topic">Тема заявки</label>
        <select class="order-form__input" id="topic" name="topic" required>
          <option value="">Выберите тему</option>
          <option value="product">Заказ товара</option>
          <option value="consultation">Консультация</option>
          <option value="delivery">Доставка</option>
        </select>
      </div>
      <div class="order-form__field">
        <label class="order-form__label" for="comment">Комментарий</label>
        <textarea class="order-form__input" id="comment" name="comment" rows="4" placeholder="Укажите дополнительную информацию"></textarea>
      </div>
      <div class="order-form__field order-form__field--checkbox">
        <input id="agreement" name="agreement" type="checkbox" required>
        <label for="agreement">Я согласен на обработку персональных данных</label>
      </div>
      <div class="order-form__actions">
        <button class="button" type="submit">Отправить</button>
        <button class="button button--secondary" type="reset">Очистить</button>
      </div>
    </form>

    <p class="success-message" id="success-message" role="status" hidden>Заявка проверена. Данные не отправляются.</p>
  </main>
  <footer class="site-footer" id="contacts">
    <div class="site-footer__inner">
      <p>&copy; 2026 Учебный проект. Все права защищены.</p>
      <p>Дисциплина: Фронтенд и бэкенд разработка</p>
      <p>Тел.: +7 (495) 000-00-00 &middot; <a href="contacts.html">Контакты</a></p>
    </div>
  </footer>
  <a class="to-top" href="#top">Наверх</a>
</body>
</html>
